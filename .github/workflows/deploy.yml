name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish site files only; tooling and config stay out of the artifact
      - name: Stage site files
        run: |
          mkdir _site
          cp -r *.html CNAME robots.txt sitemap.xml llms.txt llms-full.txt css js images assets THORChainDiagrams _site/

      # Cache-bust: stamp the commit id onto every local CSS/JS link so Cloudflare and
      # browsers fetch the new files on each deploy. Source HTML keeps plain paths.
      - name: Version CSS and JS links
        run: |
          v="${GITHUB_SHA::8}"
          find _site -maxdepth 2 -name '*.html' -exec \
            sed -i -E "s#((href|src)=\"/?(css|js)/[a-z]+\.(css|js))\"#\1?v=${v}\"#g" {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
